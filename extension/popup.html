<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    body {
      width: 320px; margin: 0; padding: 14px 14px 16px;
      background: #070b16; color: #e6ecff; font: 13px/1.5 system-ui, Segoe UI, sans-serif;
    }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    h1 span { color: #22d3ee; }
    label { display: block; font-size: 11px; color: #8fa0c9; margin: 8px 0 3px; }
    input, select {
      width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 7px;
      border: 1px solid #1f2c4d; background: #0d1428; color: #e6ecff; font-size: 12.5px;
    }
    button {
      margin-top: 10px; width: 100%; padding: 8px; border-radius: 8px; border: 0;
      background: #22d3ee; color: #04121a; font-weight: 700; cursor: pointer; font-size: 12.5px;
    }
    button.ghost { background: transparent; border: 1px solid #1f2c4d; color: #e6ecff; font-weight: 500; }
    .muted { color: #8fa0c9; font-size: 11.5px; }
    .err { color: #f87171; font-size: 11.5px; margin-top: 8px; }
    .ok { color: #4ade80; font-size: 11.5px; margin-top: 8px; }
    ul { list-style: none; margin: 10px 0 0; padding: 0; max-height: 260px; overflow: auto; }
    li {
      border: 1px solid #1f2c4d; border-radius: 9px; padding: 8px 9px; margin-bottom: 7px;
      background: #0d1428;
    }
    li b { font-size: 12.5px; }
    .sub { color: #8fa0c9; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row { display: flex; gap: 6px; margin-top: 7px; }
    .row button { margin-top: 0; }
  </style>
</head>
<body>
  <h1><span>🛡</span> SentinelVault Auto-fill</h1>

  <div id="login">
    <label>API base URL</label>
    <input id="api" value="http://localhost:8000" />
    <label>Email</label>
    <input id="email" placeholder="you@example.com" />
    <label>Master password</label>
    <input id="password" type="password" />
    <button id="btnLogin">Unlock & load vault</button>
    <div class="muted" style="margin-top:8px">
      The master password is used once to unlock; only the session token is kept in this browser.
    </div>
    <div id="err" class="err"></div>
  </div>

  <div id="vault" style="display:none">
    <div class="row" style="margin-top:0">
      <button id="btnLock" class="ghost">Lock</button>
      <button id="btnReload" class="ghost">Reload</button>
    </div>
    <div class="muted" id="who" style="margin-top:8px"></div>
    <ul id="items"></ul>
    <div class="muted" style="margin-top:6px">Click <b>Fill</b> on the page's login form.</div>
    <div id="msg" class="ok"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
